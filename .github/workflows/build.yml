name: Build Android APK (Buildozer)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt purge -y openjdk-17-jdk* temurin-17-jdk* temurin-25-jdk* || true
          sudo apt autoremove -y
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libexpat1-dev
          sudo apt install -y libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386 libtinfo5
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.37"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: course-table-apk
          path: bin/*.apk
