name: Build Android APK (Buildozer)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt purge -y openjdk-17-jdk* temurin-17-jdk* temurin-25-jdk* || true
          sudo apt autoremove -y
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libc6:i386 libstdc++6:i386 libz1:i386 libltdl-dev patchelf
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-11-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==3.0.11
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          buildozer -v android debug clean

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: course-table-apk
          path: bin/*.apk
